# Configuration applicative (non secrète). Les secrets et URLs d'infrastructure
# viennent des variables d'environnement (.env), voir .env.example.

project:
  name: imdb-episode-rating
  seed: 42

data:
  source_repo: ya0903/imdb-episode-dataset
  source_branch: main
  # Si vide : on résout le dernier commit de la branche (ingestion dynamique).
  # Sinon : SHA figé pour reproduire exactement une exécution.
  pinned_sha: ""
  raw_dir: data/raw
  processed_dir: data/processed
  min_votes: 10
  reports_dir: data/reports

# Contrôles qualité : un échec « critique » interrompt la chaîne, un « warning » est
# seulement remonté (rapport + alerte de faible sévérité).
quality:
  min_rows: 300000
  max_rows: 1000000
  min_series: 5000
  rating_mean_range: [6.0, 9.0]
  max_season: 500
  max_episode: 20000
  # Variation maximale du nombre d'épisodes par rapport au dernier snapshot validé.
  max_row_change: 0.20
  # Écart maximal entre le nombre d'épisodes déclaré par meta.json et celui lu.
  max_declared_gap: 0.02
  # Au-delà, warning : beaucoup de fichiers de séries hors meta.json.
  max_orphan_ratio: 0.10

training:
  experiment_name: imdb-episode-rating
  registered_model_name: imdb-episode-rating
  # Part des derniers épisodes de chaque série réservée au test (split temporel).
  test_size: 0.2
  # Part de l'entraînement utilisée pour l'early stopping et le tuning.
  val_size: 0.1
  n_estimators: 1000
  early_stopping_rounds: 50
  # Recherche d'hyperparamètres : trials en parallèle × threads LightGBM par trial.
  # 5 × 2 = 10 cœurs = limite CPU du conteneur pipeline (docker-compose.yml).
  n_trials: 30
  parallel_trials: 5
  threads_per_trial: 2
  search_space:
    num_leaves: [15, 255]
    learning_rate: [0.02, 0.2]
    min_child_samples: [10, 300]
    colsample_bytree: [0.5, 1.0]
    subsample: [0.5, 1.0]
    reg_lambda: [0.0, 10.0]

promotion:
  metric: rmse
  # Le challenger doit battre la baseline « moyenne des épisodes précédents »...
  must_beat_baseline: true
  # ... rester sous un plafond absolu...
  max_rmse: 1.0
  # ... et améliorer le champion actuel (évalué sur le même jeu de test) d'au moins ce delta.
  # 0.005 : en dessous, l'écart relève du bruit (observé : 0.0014 entre deux tunings) et
  # changer de modèle en production n'apporte que du risque.
  min_improvement: 0.005

# Suivi en production : comparaison des prédictions aux notes publiées ensuite (J+1).
monitoring:
  # Alerte si la RMSE « live » dépasse ce seuil (sur au moins min_samples prédictions).
  max_live_rmse: 0.8
  min_samples: 20
  # Fenêtre d'agrégation des métriques live.
  window_days: 7
  # Au-delà, une prédiction d'épisode jamais publié n'est plus attendue.
  pending_max_days: 30
  experiment_name: imdb-episode-rating-production
