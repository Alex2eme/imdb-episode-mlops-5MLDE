# Infrastructure locale de la plateforme MLOps.
# Démarrage : docker compose up -d   (nécessite un fichier .env, voir .env.example)

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - ./docker/postgres/grafana-readonly.sh:/docker-entrypoint-initdb.d/20-grafana-readonly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {memory: 512m}

  mlflow:
    <<: *restart
    build: ./docker/mlflow
    image: imdb-mlops/mlflow:3.18.0
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # Désactive les workers de jobs GenAI (évaluation LLM, archivage de traces) :
      # inutiles ici et très gourmands en mémoire.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_SERVER_JOB_ENABLE_PERIODIC_TASKS: "false"
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --workers 2
      --uvicorn-opts "--timeout-keep-alive 120"
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    ports: ["5000:5000"]
    volumes: [mlflow_artifacts:/mlartifacts]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {memory: 1g}

  prefect-server:
    <<: *restart
    image: prefecthq/prefect:3.8.8-python3.12
    depends_on:
      postgres: {condition: service_healthy}
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports: ["4200:4200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {memory: 768m}

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {memory: 192m}

  # Conteneur d'exécution des traitements (ponctuel) :
  #   docker compose run --rm pipeline python -m imdb_mlops data
  pipeline:
    build: &app-build
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: imdb-mlops/app:latest
    profiles: ["jobs"]
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/app
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REDIS_URL: redis://redis:6379/0
      PREFECT_API_URL: http://prefect-server:4200/api
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Échec rapide côté client MLflow : les relances sont pilotées par Prefect.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "30"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        # 10 cœurs sur 12 : l'entraînement ne doit pas affamer MLflow/PostgreSQL.
        limits: {memory: 2g, cpus: "10"}

  # Worker Prefect : enregistre les déploiements (planifications) et exécute les runs.
  worker:
    <<: *restart
    build: *app-build
    image: imdb-mlops/app:latest
    command: python -m imdb_mlops.orchestration.serve
    depends_on:
      postgres: {condition: service_healthy}
      prefect-server: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    environment:
      <<: *app-env
      PREFECT_LOGGING_EXTRA_LOGGERS: imdb_mlops
      WATCH_INTERVAL_S: ${WATCH_INTERVAL_S:-1800}
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits: {memory: 2g, cpus: "10"}

  # API de prédiction. Workers, CPU, mémoire et cache paramétrables (tests de charge).
  api:
    <<: *restart
    build: *app-build
    image: imdb-mlops/app:latest
    # Forme liste : un bloc YAML replié conservait des retours à la ligne et les options
    # --workers/--no-access-log étaient ignorées (constaté pendant les tests de charge).
    command:
      - sh
      - -c
      # --timeout-worker-healthcheck 30 : à 5 s (défaut), un worker saturé ne répondait plus
      # au ping du processus parent et était tué en pleine charge (connexions coupées).
      - exec uvicorn imdb_mlops.api.app:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS} --no-access-log --timeout-worker-healthcheck 30
    # Métriques Prometheus multi-processus : tmpfs, donc vidé à chaque démarrage.
    tmpfs:
      - /tmp/prom
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      <<: *app-env
      API_WORKERS: ${API_WORKERS:-2}
      # Redis désactivé par défaut : -13 % de débit mesuré (hit ~16 %, voir
      # reports/loadtests/RESULTS.md). Le cache LRU local par worker reste actif.
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      LOCAL_CACHE_SIZE: ${LOCAL_CACHE_SIZE:-50000}
      MODEL_REFRESH_S: "30"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      # Une seule thread OpenMP par worker (voir model_store._predict_array).
      OMP_NUM_THREADS: "1"
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    deploy:
      resources:
        limits: {memory: "${API_MEMORY:-2g}", cpus: "${API_CPUS:-2}"}

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports: ["9090:9090"]
    deploy:
      resources:
        limits: {memory: 256m}

  grafana:
    <<: *restart
    image: grafana/grafana:11.4.0
    depends_on: [prometheus, postgres]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Consultation sans compte (rôle lecteur) : pratique pour la démonstration.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    deploy:
      resources:
        limits: {memory: 256m}

volumes:
  pg_data:
  prom_data:
  grafana_data:
  mlflow_artifacts:
