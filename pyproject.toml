[project]
name = "imdb-mlops"
version = "0.1.0"
description = "Industrialisation d'un modèle de prédiction de la note d'épisodes de séries (données IMDb)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "mlflow>=2.16",
    "boto3>=1.34",
    "great-expectations>=1.0",
    "prefect>=3.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "locust>=2.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imdb_mlops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PL", "RUF"]
# PLC0415 : imports différés volontaires (CLI rapide, GX/MLflow lourds à importer)
# N803/N806 : convention ML (X_train, X_test). PLR0915 : fonction d'orchestration du run.
ignore = ["PLR0913", "PLR0917", "PLR0915", "PLR2004", "PLC0415", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Requêtes SQL/PromQL des dashboards : plus lisibles d'un seul tenant.
"docker/grafana/build_dashboards.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: nécessite les conteneurs Docker démarrés"]
